<script src="../app.js"></script>
<script>
(function () {
  /* The administrator password is held ONLY in this in-memory variable for the
     life of the page. It is deliberately never written to any browser storage,
     to a cookie, or to the URL — closing or reloading the tab must force it to
     be entered again. */
  var adminPassword = null;

  var authBox = document.getElementById('auth-box');
  var authForm = document.getElementById('auth-form');
  var authBtn = document.getElementById('auth-submit');
  var authStatus = document.getElementById('auth-status');
  var panel = document.getElementById('admin-panel');
  var table = document.getElementById('admin-table');
  var tbody = document.getElementById('admin-tbody');
  var emptyState = document.getElementById('admin-empty');
  var countLine = document.getElementById('admin-count');
  var listStatus = document.getElementById('admin-status');

  var isKo = function () { return (typeof lang === 'undefined' ? 'ko' : lang) !== 'en'; };
  var relang = function () { if (typeof applyLang === 'function') applyLang(); };

  function esc(v) {
    return String(v == null ? '' : v)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function setStatus(el, ko, en, kind) {
    el.hidden = false;
    el.className = 'form-status' + (kind ? ' form-status-' + kind : '');
    el.setAttribute('data-ko', ko);
    el.setAttribute('data-en', en);
    el.textContent = isKo() ? ko : en;
  }

  function fmtDate(v) {
    if (!v) return '—';
    var d = new Date(v);
    if (isNaN(d.getTime())) return String(v);
    var p = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate());
  }

  function api(body) {
    return fetch('/api/admin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
  }

  var STATUS_META = {
    pending:  { cls: 'outcome-pending',   ko: '승인 대기', en: 'Pending',  rank: 0 },
    approved: { cls: 'outcome-confirmed', ko: '승인됨',   en: 'Approved', rank: 1 },
    revoked:  { cls: 'outcome-missed',    ko: '해제됨',   en: 'Revoked',  rank: 2 }
  };

  function actionsHtml(m) {
    var email = esc(m.email);
    if (m.status === 'pending') {
      return '<div class="admin-actions" data-row="' + email + '">' +
        '<button type="button" class="btn btn-gold btn-sm" data-act="approve" data-email="' + email + '" data-ko="승인" data-en="Approve">승인</button>' +
        '</div>';
    }
    if (m.status === 'approved') {
      return '<div class="admin-actions" data-row="' + email + '">' +
        '<button type="button" class="btn btn-outline btn-sm" data-act="ask-revoke" data-email="' + email + '" data-ko="해제" data-en="Revoke">해제</button>' +
        '</div>';
    }
    return '<span class="admin-muted">—</span>';
  }

  function render(members) {
    var list = (members || []).slice().sort(function (a, b) {
      var ra = (STATUS_META[a.status] || { rank: 9 }).rank;
      var rb = (STATUS_META[b.status] || { rank: 9 }).rank;
      if (ra !== rb) return ra - rb;
      return String(b.requestedAt || '').localeCompare(String(a.requestedAt || ''));
    });

    if (!list.length) {
      table.hidden = true;
      emptyState.hidden = false;
      countLine.textContent = '';
      countLine.removeAttribute('data-ko');
      countLine.removeAttribute('data-en');
      return;
    }

    var pending = list.filter(function (m) { return m.status === 'pending'; }).length;
    var ko = '전체 ' + list.length + '명 · 승인 대기 ' + pending + '명';
    var en = list.length + ' total · ' + pending + ' pending';
    countLine.setAttribute('data-ko', ko);
    countLine.setAttribute('data-en', en);
    countLine.textContent = isKo() ? ko : en;

    tbody.innerHTML = list.map(function (m) {
      var meta = STATUS_META[m.status] || { cls: 'outcome-pending', ko: m.status, en: m.status };
      return '<tr>' +
        '<td><span class="admin-name">' + esc(m.name) + '</span>' +
            '<span class="admin-email">' + esc(m.email) + '</span></td>' +
        '<td>' + esc(m.organization) + '</td>' +
        '<td class="admin-purpose">' + esc(m.purpose) + '</td>' +
        '<td>' + esc(fmtDate(m.requestedAt)) + '</td>' +
        '<td><span class="outcome-tag ' + meta.cls + '" data-ko="' + esc(meta.ko) + '" data-en="' + esc(meta.en) + '">' + esc(meta.ko) + '</span></td>' +
        '<td>' + actionsHtml(m) + '</td>' +
      '</tr>';
    }).join('');

    emptyState.hidden = true;
    table.hidden = false;
    relang();
  }

  function loadList(password) {
    return api({ password: password, action: 'list' }).then(function (res) {
      if (res.status === 401) { var e = new Error('unauthorized'); e.code = 401; throw e; }
      if (!res.ok) throw new Error('failed');
      return res.json();
    });
  }

  /* ---- password gate ---- */
  authForm.addEventListener('submit', function (e) {
    e.preventDefault();
    if (!authForm.reportValidity()) return;
    var pw = document.getElementById('ad-pw').value;

    authStatus.hidden = true;
    authBtn.disabled = true;
    authBtn.classList.add('is-loading');

    loadList(pw).then(function (data) {
      adminPassword = pw;           // kept in memory only
      authBox.hidden = true;
      panel.hidden = false;
      render(data.members);
    }).catch(function (err) {
      authBtn.disabled = false;
      authBtn.classList.remove('is-loading');
      if (err && err.code === 401) {
        setStatus(authStatus, '비밀번호가 올바르지 않습니다.', 'That password is not correct.', 'error');
      } else {
        setStatus(authStatus, '목록을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.', 'Could not load the list. Please try again in a little while.', 'error');
      }
      document.getElementById('ad-pw').select();
    });
  });

  /* ---- refresh helper ---- */
  function refresh() {
    return loadList(adminPassword).then(function (data) {
      listStatus.hidden = true;
      render(data.members);
    }).catch(function () {
      setStatus(listStatus, '목록을 새로 고치지 못했습니다. 잠시 후 다시 시도해 주세요.', 'Could not refresh the list. Please try again in a little while.', 'error');
    });
  }

  function runAction(action, email, btn) {
    btn.disabled = true;
    btn.classList.add('is-loading');
    listStatus.hidden = true;
    api({ password: adminPassword, action: action, email: email }).then(function (res) {
      if (!res.ok) throw new Error('failed');
      return refresh();
    }).catch(function () {
      btn.disabled = false;
      btn.classList.remove('is-loading');
      setStatus(listStatus, '요청을 처리하지 못했습니다. 잠시 후 다시 시도해 주세요.', 'The request could not be completed. Please try again in a little while.', 'error');
    });
  }

  /* ---- inline two-step revoke (no native dialogs: they freeze automation) ---- */
  function askRevoke(cell, email) {
    cell.innerHTML =
      '<span class="revoke-ask-text" data-ko="정말 해제할까요?" data-en="Really revoke access?">정말 해제할까요?</span>' +
      '<button type="button" class="btn btn-gold btn-sm" data-act="revoke-yes" data-email="' + esc(email) + '" data-ko="예" data-en="Yes">예</button>' +
      '<button type="button" class="btn btn-outline btn-sm" data-act="revoke-no" data-email="' + esc(email) + '" data-ko="취소" data-en="Cancel">취소</button>';
    relang();
  }

  function resetRevoke(cell, email) {
    cell.innerHTML =
      '<button type="button" class="btn btn-outline btn-sm" data-act="ask-revoke" data-email="' + esc(email) + '" data-ko="해제" data-en="Revoke">해제</button>';
    relang();
  }

  tbody.addEventListener('click', function (e) {
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var act = btn.getAttribute('data-act');
    var email = btn.getAttribute('data-email');
    var cell = btn.closest('.admin-actions');

    if (act === 'approve') { runAction('approve', email, btn); return; }
    if (act === 'ask-revoke') { askRevoke(cell, email); return; }
    if (act === 'revoke-no') { resetRevoke(cell, email); return; }
    if (act === 'revoke-yes') { runAction('revoke', email, btn); return; }
  });
})();
</script>
</body>
