<!--
  기고문 템플릿 — 시니어 펠로우의 원고를 받으면 이 파일을 복사해서 새 파일명(articles/<슬러그>.html)으로
  저장 후 내용을 채우세요. 이 파일 자체는 사이트에 링크돼 있지 않습니다(참고용).

  등록 절차:
  1. 이 파일을 articles/<slug>.html로 복사, 내용 채우기.
  2. articles/index.html의 #articles-grid에 카드 하나 추가:
     <a class="article-card" href="<slug>.html">
       <span class="tag">[분류]</span>
       <h3>[제목]</h3>
       <p class="excerpt">[요약 1~2문장]</p>
       <span class="meta">[YYYY-MM-DD]</span>
     </a>
  3. #empty-state div는 기고문이 1개라도 생기면 삭제(또는 CSS로 숨김).
  4. 필자가 처음이면 writers/index.html에도 writer-card 추가.
-->
