# TIGERDYNE NEXUS — 정적 사이트 배포 설정.
# 이 사이트는 빌드 단계가 없는 순수 정적 사이트다. package.json이 존재하더라도
# Netlify가 빌드를 시도하지 않도록 command를 명시적으로 비워 둔다.

[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# /api/* -> Netlify Functions
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
